<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Portal</title>
</head>
<body>

    <!--Basic how to add images with src-->
    <h1>Movie Portal</h1>

    <h2>Highlight Movie</h2>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSjk4PDtPXtUiOGy7Rhev_3jD_L2Uo_F38sBHAh6WKQQ&s=10"
    , alt="Oddisey Movie Poster">

    <h2>Useful links</h2>


    <!--Here we have a list that point to links with a href-->
    <ul>
        <li>
            <a href="https://www.imdb.com" target="_blank"> IMBd</a>
        </li>
        <li>
            <a href="https://www.rottentomatoes.com" target="_blank"> Rotten Tomatoes</a>
        </li>
        <li>
            <a href="#Contact" target="_blank"> Go to contact</a>
        </li>
    </ul>

    <!--How to add tables with very different ways-->
    <h2>Movies</h2>
    <table border="1">
        <thead>
            <tr>
                <th colspan="4">Top 3 movies</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Title</th>
                <th>Genre</th>
                <th>Year</th>
                <th>Score</th>
            </tr>
            <tr>
                <td>The Batman</td>
                <td>Action</td>
                <td>2022</td>
                <td>5/5</td>
            </tr>
            <tr>
                <td>Eternal Sunshine of the Spotless Mind</td>
                <td>Science Fiction / Romance</td>
                <td>2004</td>
                <td>5/5</td>
            </tr>
            <tr>
                <td>Princess Mononoke</td>
                <td>Fantasy / Adventure</td>
                <td>1997</td>
                <td>5/5</td>
            </tr>
        </tbody>
    </table>

    <!--Forms, labels, etc-->
    <div id="Contact">
        <h2>Contact</h2>
        <form 
        method="post", 
        action="mailto:wfakeemail@gmail.com?cc=:another@gmail.com&subject=Contact""> 
        
        <label for="Name">Name: </label>
        <input type="text" name="name" id="name" required/>

        <br>

        <label for="E-mail">E-mail: </label>
        <input type="email" name="email" id="email" required/>

        <br>

        <label for="region">Region: </label>
        <select name="region" id="region">
            <option value="San Diego">San Diego</option>
            <option value="San Francisco">San Francisco</option>
            <option value="Los Angeles">Los Angeles</option>
        </select>

        <br>

        <label for="comment">Comment </label>
        <br>
        <textarea name="Comment", id="comment", rows="5", cols="40"></textarea>
        
        <br>

        <button type="submit">Contact</button>

        </form>
    </div>

</body>
</html>
